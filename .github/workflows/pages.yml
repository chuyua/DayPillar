name: Verify and publish DayPillar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:integration
      - run: npm run typecheck
      - run: npm run build
        env:
          BASE_PATH: /DayPillar/
      - run: node --test tests/dist.smoke.test.mjs
      # Private repos on plans without private Pages still retain a verified build.
      - uses: actions/upload-artifact@v4
        with:
          name: daypillar-static-site
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !github.event.repository.private
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && !github.event.repository.private
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && !github.event.repository.private
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
