name: Verify and publish DayPillar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:integration
      - run: npm run typecheck
      - run: npm run build
        env:
          BASE_PATH: /DayPillar/
      - run: node --test tests/dist.smoke.test.mjs
      # 真实浏览器回归：键盘焦点、移动抽屉、筛选、日期边界、深色模式。
      # 官方 Ubuntu 24.04 Runner 已自带 Chrome，不额外下载浏览器及 apt 依赖。
      - run: google-chrome --version
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: daypillar-browser-test-failures
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      # Private repos on plans without private Pages still retain a verified build.
      - uses: actions/upload-artifact@v6
        with:
          name: daypillar-static-site
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/configure-pages@v6
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !github.event.repository.private
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request' && !github.event.repository.private
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && !github.event.repository.private
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
