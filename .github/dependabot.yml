# Scope version-update PRs to the calendar engine only.
# GitHub checks npm weekly and opens a PR if a new tyme4ts version is available.
# PR CI already runs npm ci, dates/integration, typecheck, build and real Chrome E2E.
# Never auto-merge: calendar output must be reviewed before merging.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "Asia/Taipei"
    allow:
      - dependency-name: "tyme4ts"
    open-pull-requests-limit: 1
    versioning-strategy: increase
    commit-message:
      prefix: "chore(deps)"
